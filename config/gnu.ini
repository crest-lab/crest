# machine file: gnu.ini
# Usage:  meson setup build --native-file cross/gnu.ini
#
# Selects the GNU toolchain explicitly.  Useful when both GCC and Intel
# compilers are installed and the environment default is not what you want.

[binaries]
c       = 'gcc'
fortran = 'gfortran'
ar      = 'ar'
strip   = 'strip'

[built-in options]
# Fortran standard — free-form F2018 is safe for crest
# (gfortran accepts it without an explicit flag, but being explicit helps)
fortran_args = ['-std=f2018']
