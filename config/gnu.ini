# machine file: gnu.ini
# Usage:  meson setup build --native-file config/gnu.ini
#
# Selects the GNU toolchain explicitly.  Useful when both GCC and Intel
# compilers are installed and the environment default is not what you want.
# The C++ compiler is set as well: tblite requires one, and meson otherwise
# falls back to whatever CXX points to (e.g. icpx), which silently disables
# tblite, ddX and GFN-FF when it cannot link with the GNU runtime.
#
# No global -std flag: fortran_args apply to all subprojects, and some of
# them (ddX, gfn0) contain fixed-form or GNU-extension code.

[binaries]
c       = 'gcc'
cpp     = 'g++'
fortran = 'gfortran'
ar      = 'ar'
strip   = 'strip'
