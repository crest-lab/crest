# machine file: intel-fortran-gnu-c.ini
# Usage:  meson setup build --native-file cross/intel-fortran-gnu-c.ini
#
# Mixes Intel Fortran (ifx) with GNU C (gcc).
# This is a common HPC pattern where only the Fortran compiler is licensed
# as Intel but C utilities default to GCC.
#
# IMPORTANT — OpenMP runtime compatibility:
#   ifx links against Intel's libomp (libiomp5).
#   gcc links against GNU's libgomp.
#   The two runtimes must NOT both be loaded in the same process.
#   Resolution: let ifx drive the final link step so it picks up libomp.
#   Do NOT pass -fopenmp to gcc translation units; instead use
#   -Dopenmp=true which the build system applies only to Fortran sources.
#
# IMPORTANT — MKL threading layer:
#   With this mixed toolchain, use mkl_intel_thread (not mkl_gnu_thread)
#   because the Fortran driver (ifx/ifort) owns the OpenMP runtime.
#   Set:  -Dlapack=mkl

[binaries]
c       = 'gcc'
fortran = 'ifx'
ar      = 'ar'
strip   = 'strip'
