# machine file: intel-classic.ini
# Usage:  meson setup build --native-file cross/intel-classic.ini
#
# Uses the classic Intel compilers (ifort, icc).
# Note: icc was deprecated in oneAPI 2023 in favour of icx.
#       For new installations prefer intel-llvm.ini instead.
# Source the Intel environment first:
#   source /opt/intel/oneapi/setvars.sh

[binaries]
c       = 'icc'
fortran = 'ifort'
ar      = 'ar'
strip   = 'strip'

#[built-in options]
# -warn all is ifort's equivalent of -Wall
#fortran_args = ['-warn', 'all']
