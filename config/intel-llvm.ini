# machine file: intel-llvm.ini
# Usage:  meson setup build --native-file cross/intel-llvm.ini
#
# Uses the Intel LLVM-based compilers (ifx, icx) from oneAPI 2023+.
# Source the Intel environment first:
#   source /opt/intel/oneapi/setvars.sh

[binaries]
c       = 'icx'
fortran = 'ifx'
ar      = 'ar'
strip   = 'strip'

#[built-in options]
#fortran_args = ['-warn', 'all']
